<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Companion | Cozy Study Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9f4f0;
            --card-bg: #ffffff;
            --accent-soft: #e8d7ff;
            --accent-bold: #b8a3d1;
            --text-color: #6d5c5c;
            --btn-start: #d4e9d7;
            --btn-reset: #f9d5d3;
            --border-color: #eeeae6;
            --btn-cta: #b8a3d1;
        }

        body {
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            color: var(--text-color);
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 350px;
            border: 4px solid white;
        }

        #pet-display {
            font-size: 8rem;
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.05));
        }

        .pet-bounce {
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 1rem 0;
            letter-spacing: -2px;
        }

        .status-text {
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button, .cta-button {
            border: none;
            padding: 12px 20px;
            border-radius: 15px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .cta-button:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* To-Do Section Styling */
        .todo-section {
            border-top: 2px solid var(--border-color);
            padding-top: 1.5rem;
            text-align: left;
        }

        .todo-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            font-family: 'Quicksand', sans-serif;
            outline: none;
        }

        #add-task-btn { background-color: var(--accent-soft); }
        
        #clear-tasks-btn { 
            background-color: transparent; 
            font-size: 0.75rem; 
            padding: 5px; 
            color: #b8a3d1;
            width: 100%;
            margin-top: 10px;
        }

        #todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .todo-item {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .todo-item:hover { background-color: #fff9f9; }
        .todo-item.completed {
            text-decoration: line-through;
            opacity: 0.5;
        }

        #start-btn { background-color: var(--btn-start); flex: 2; }
        #pause-btn { background-color: var(--accent-soft); flex: 1; }
        #reset-btn { background-color: var(--btn-reset); flex: 1; }

        /* New CTA Column/Section */
        .cta-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px dashed var(--border-color);
        }

        .cta-button {
            background-color: var(--btn-cta);
            color: white;
            width: 80%;
            font-size: 0.9rem;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <a href="https://s78664.github.io" style="position:absolute; top:20px; left:20px; text-decoration: none; color: var(--text-color);">← Back to Home</a>

    <div class="container">
        <div id="pet-display">😴</div>
        <div class="status-text" id="status">Sleeping...</div>
        <div id="timer-display">25:00</div>
        
        <div class="controls">
            <button id="start-btn">Start Focus</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div class="todo-section">
            <div class="todo-input-group">
                <input type="text" id="todo-input" placeholder="Add a task...">
                <button id="add-task-btn">Add</button>
            </div>
            <ul id="todo-list"></ul>
            <button id="clear-tasks-btn">Clear All Tasks</button>
        </div>

        <div class="cta-section">
            <a href="[PASTE YOUR APP URL HERE]" class="cta-button" target="_blank">Try My Focus Timer App</a>
        </div>
    </div>

    <audio id="finish-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <script>
        // --- TIMER LOGIC ---
        let timeLeft = 25 * 60;
        let timerId = null;
        let isRunning = false;

        const petDisplay = document.getElementById('pet-display');
        const timerDisplay = document.getElementById('timer-display');
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const finishSound = document.getElementById('finish-sound');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.title = `${timerDisplay.textContent} | Focus Companion`;
        }

        function setPetState(state) {
            switch(state) {
                case 'sleeping':
                    petDisplay.textContent = '😴';
                    statusText.textContent = 'Sleeping...';
                    petDisplay.classList.remove('pet-bounce');
                    break;
                case 'focused':
                    petDisplay.textContent = '😎';
                    statusText.textContent = 'Focusing...';
                    petDisplay.classList.add('pet-bounce');
                    break;
                case 'happy':
                    petDisplay.textContent = '🥳';
                    statusText.textContent = 'Great Job!';
                    petDisplay.classList.add('pet-bounce');
                    break;
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            setPetState('focused');
            startBtn.disabled = true;
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    isRunning = false;
                    setPetState('happy');
                    finishSound.play();
                    startBtn.disabled = false;
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.disabled = false;
            statusText.textContent = 'Paused';
            petDisplay.classList.remove('pet-bounce');
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            timeLeft = 25 * 60;
            updateDisplay();
            setPetState('sleeping');
            startBtn.disabled = false;
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // --- TO-DO LIST LOGIC ---
        const todoInput = document.getElementById('todo-input');
        const addTaskBtn = document.getElementById('add-task-btn');
        const todoList = document.getElementById('todo-list');
        const clearTasksBtn = document.getElementById('clear-tasks-btn');

        let tasks = JSON.parse(localStorage.getItem('focusTasks')) || [];

        function saveTasks() {
            localStorage.setItem('focusTasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            todoList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${task.completed ? 'completed' : ''}`;
                li.textContent = task.text;
                li.onclick = () => toggleTask(index);
                todoList.appendChild(li);
            });
        }

        function addTask() {
            const text = todoInput.value.trim();
            if (text) {
                tasks.push({ text, completed: false });
                todoInput.value = '';
                saveTasks();
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function clearTasks() {
            if(confirm("Clear all tasks?")) {
                tasks = [];
                saveTasks();
                renderTasks();
            }
        }

        addTaskBtn.addEventListener('click', addTask);
        todoInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') addTask(); });
        clearTasksBtn.addEventListener('click', clearTasks);

        // Initialize
        updateDisplay();
        renderTasks();
    </script>
</body>
</html>
